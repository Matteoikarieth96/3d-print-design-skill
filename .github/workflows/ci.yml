name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild the examples
        run: |
          export PRINT3D_SKILL_DIR="$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/examples/cable-clip" && python -P build.py
          cd "$GITHUB_WORKSPACE/examples/calibration-coupon" && python -P "$GITHUB_WORKSPACE/scripts/calibration_coupon.py" build --out out
